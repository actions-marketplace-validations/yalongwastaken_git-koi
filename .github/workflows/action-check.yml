name: Action check

# Run the Action from this checkout against the repository owner and attach what
# it generates. Nothing is committed; this only proves the Action works end to end.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          output-dir: koi-output
      - name: Attach the koi
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi
          path: koi-output/
          if-no-files-found: error
